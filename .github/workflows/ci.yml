# Builds the app with the editors and runs the editors' tests: engine (host), co-editing (the
# host engine and a web editor through a Document Server), unit (JVM) and UI (emulator). Each job
# runs build/docker-bake.hcl's targets (the repositories' module Dockerfiles) with BuildKit's
# GitHub Actions cache, so most runs only build the editors (editors-engine, editors-android) and
# the app. Core comes prebuilt from core's CI when it published the pinned core
# (build/scripts/fetch-core.sh); else the Core jobs build it through ccache. The bakes run in docker/bake-action:
# the cache needs the Actions runtime token, which only actions get, so run steps (npm and the
# like) never see it. A tag v<VERSION> also publishes the APKs as a GitHub release once every job
# passed.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # A cache-to line for a target: format(env.CACHE_TO, target, mode). Only main writes the cache:
  # PRs and tags can read main's, while a PR's or a tag's own cache would only push main's out
  CACHE_TO: ${{ github.ref == 'refs/heads/main' && '{0}.cache-to=type=gha,mode={1},ignore-error=true,scope={0}' || '' }}
  # bake-action's defaults: provenance files in the local outputs, a record artifact per bake
  BUILDX_NO_DEFAULT_ATTESTATIONS: 1
  DOCKER_BUILD_SUMMARY: false
  # Releases take only core packages built on core's main and stable branches
  EO_CORE_CHANNELS: ${{ startsWith(github.ref, 'refs/tags/') && 'main' || '' }}

concurrency:
  group: ci-${{ github.ref }}
  # Runs on main finish, so they fill the cache that PRs and tags read; tags are releases
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Without a package of the pinned core yet, wait for core's CI instead of building core
  wait-for-core:
    uses: ./.github/workflows/wait-for-core.yml
    with:
      packages: android-arm64-v8a/android android-x86_64/android linux-amd64/desktop

  # Core for Android per ABI, prebuilt or built here: an artifact for the apk job either way
  core-android:
    name: Core (${{ matrix.target }})
    needs: wait-for-core
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      matrix:
        include:
          - { target: core-android-arm64, abi: arm64-v8a, var: CORE_ANDROID_ARM64 }
          - { target: core-android-x64,   abi: x86_64,    var: CORE_ANDROID_X64 }
    steps:
      - name: Free disk space (the build needs about 20 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af
          df -h /
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      # Nothing to build when core's CI already published this core
      - name: Prebuilt core
        run: build/scripts/fetch-core.sh ${{ matrix.abi }} >>"$GITHUB_ENV"
      # The runners start with an empty BuildKit cache, so ccache keeps core's objects. A seed
      # changes the build's layer, so its result can't come from the layer cache. Unlike that
      # cache, PRs save it too: main has core packages, so it rarely builds core, and only a run
      # that built core gets here
      - name: Restore ccache
        if: env[matrix.var] == ''
        uses: actions/cache/restore@v4
        with:
          path: build/ccache-seed
          key: ccache-android-${{ matrix.abi }}-${{ github.run_id }}
          restore-keys: ccache-android-${{ matrix.abi }}-
      - name: ccache seed
        if: env[matrix.var] == ''
        run: mkdir -p build/ccache-seed
      - name: Build core
        if: env[matrix.var] == ''
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: build
          targets: ${{ matrix.target }}
          set: |
            android-ndk.cache-from=type=gha,scope=android-ndk
            ${{ format(env.CACHE_TO, 'android-ndk', 'max') }}
            ${{ matrix.target }}.target=core-android-ci
            ${{ matrix.target }}.args.CORE_CCACHE=1
            ${{ matrix.target }}.contexts.ccache-seed=./ccache-seed
            ${{ matrix.target }}.output=type=local,dest=out/core-android/${{ matrix.target }}
      # actions/cache only finds what was saved from the path it restores to
      - name: ccache statistics
        if: env[matrix.var] == ''
        working-directory: build
        run: |
          rm -rf ccache-seed
          mv out/core-android/${{ matrix.target }}/ccache ccache-seed
          cat ccache-seed/last-stats.txt
      - name: Save ccache
        if: env[matrix.var] == '' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/cache/save@v4
        with:
          path: build/ccache-seed
          key: ccache-android-${{ matrix.abi }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: build/${{ env[matrix.var] != '' && format('core-prebuilt/{0}', matrix.abi) || format('out/core-android/{0}/{1}', matrix.target, matrix.abi) }}
          if-no-files-found: error
          retention-days: 7

  # Every run that builds core saves its ccache under a new key, and only the newest one per ABI
  # is restored. Deletes the others of this ref, or they push out the rest of the cache.
  prune-ccache:
    name: Prune ccache
    needs: core-android
    if: always() && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Prune
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key ccache-android- \
              --sort created_at --order desc --limit 1000 --json id,key |
            jq -r 'group_by(.key | sub("-[0-9]+$"; "")) | map(.[1:]) | flatten | .[].id' |
            while read -r id; do
              gh cache delete "$id" --repo "$GITHUB_REPOSITORY" || true
            done

  apk:
    name: APK and unit tests
    needs: core-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Version
        run: |
          build/scripts/version.sh >>"$GITHUB_ENV"
          echo "DICTIONARIES_COMMIT=$(git rev-parse HEAD:dictionaries)" >>"$GITHUB_ENV"
      # Core as local contexts (CORE_ANDROID_*): with core's targets in one bake, only one ABI
      # finds its cache and the other one is built again
      - uses: actions/download-artifact@v4
        with:
          pattern: core-android-*
          path: build/out/core-android
      - name: Unit tests
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: build
          targets: unit-tests
          set: ${{ env.CACHE }}
      - name: Unit tests' result
        working-directory: build
        run: |
          tail -30 out/unit-tests/gradle.log
          test "$(cat out/unit-tests/result)" = 0
      - name: APK
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: build
          targets: apk
          set: |
            ${{ env.CACHE }}
            ${{ format(env.CACHE_TO, 'android-ndk', 'max') }}
            ${{ format(env.CACHE_TO, 'sdkjs-native', 'max') }}
            ${{ format(env.CACHE_TO, 'dictionaries', 'max') }}
            ${{ format(env.CACHE_TO, 'apk', 'max') }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests
          path: build/out/unit-tests
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            build/out/euro-office-documents-*arm64-v8a*.apk
            build/out/euro-office-documents-*x86_64*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk-nextcloud-office
          if-no-files-found: error
          path: |
            build/out/nextcloud-office-*arm64-v8a*.apk
            build/out/nextcloud-office-*x86_64*.apk
    env:
      CORE_ANDROID_ARM64: ./out/core-android/core-android-arm64
      CORE_ANDROID_X64: ./out/core-android/core-android-x64
      CACHE: |
        android-ndk.cache-from=type=gha,scope=android-ndk
        sdkjs-native.cache-from=type=gha,scope=sdkjs-native
        dictionaries.cache-from=type=gha,scope=dictionaries
        apk.cache-from=type=gha,scope=apk
        unit-tests.cache-from=type=gha,scope=apk

  engine-tests:
    name: Engine and co-editing tests
    needs: wait-for-core
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: read
    env:
      # The Document Server for co-editing (its development image follows DocumentServer's main)
      DOCUMENT_SERVER_IMAGE: ghcr.io/euro-office/documentserver:latest-dev
      DOCUMENT_SERVER_SECRET: ci-co-editing-secret
      CACHE: |
        core-base-desktop.cache-from=type=gha,scope=core-base-desktop
        core-host.cache-from=type=gha,scope=core-host
        sdkjs-native.cache-from=type=gha,scope=sdkjs-native
        engine-host.cache-from=type=gha,scope=engine-host
    steps:
      - name: Free disk space (core for the host needs about 20 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Prebuilt core
        run: build/scripts/fetch-core.sh host >>"$GITHUB_ENV"
      - name: Engine tests
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: build
          targets: engine-tests
          set: |
            ${{ env.CACHE }}
            ${{ format(env.CACHE_TO, 'core-base-desktop', 'max') }}
            ${{ format(env.CACHE_TO, 'core-host', 'max') }}
      - name: Engine tests' result
        working-directory: build
        run: |
          cat out/engine-tests/tests.log
          test "$(cat out/engine-tests/result)" = 0
      - name: Engine for the co-editing tests
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: build
          targets: engine-host
          load: true
          set: |
            ${{ env.CACHE }}
            ${{ format(env.CACHE_TO, 'core-base-desktop', 'max') }}
            ${{ format(env.CACHE_TO, 'engine-host', 'max') }}
      # Co-editing: the engine as the app runs it and a web editor (Playwright) edit the sample
      # files together, and a PDF the engine tests saved; a small storage (tools/coedit/storage.mjs)
      # stands in for Nextcloud
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Document Server
        run: |
          docker run -d --name documentserver --network host -e JWT_SECRET="$DOCUMENT_SERVER_SECRET" \
              -e ALLOW_PRIVATE_IP_ADDRESS=true -e USE_UNAUTHORIZED_STORAGE=true "$DOCUMENT_SERVER_IMAGE"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Co-editing tools
        working-directory: editors-engine/tools/coedit
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Co-editing tests
        run: |
          for _ in $(seq 1 60); do
              [ "$(curl -sf http://localhost/healthcheck)" = "true" ] && break
              sleep 5
          done
          RUN_ENGINE="docker run -i --rm --network host --user $(id -u):$(id -g) -v $PWD:/src -w /src -e EO_REPL=1 ghcr.io/euro-office/editors-engine-host eo-render /package/bin {doc} build/work/coedit/engine 1"
          export RUN_ENGINE
          VERBOSE=1 node editors-engine/tools/coedit/check.mjs --document-server http://localhost \
              --secret "$DOCUMENT_SERVER_SECRET" --storage-url http://localhost:8095 \
              document-templates/sample/sample.docx document-templates/sample/sample.pptx document-templates/sample/sample.xlsx \
              build/out/engine-tests/files/docs-pdf.pdf
      - if: failure()
        run: docker logs documentserver 2>&1 | tail -200
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: co-editing
          path: build/work/coedit/storage
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-tests
          path: build/out/engine-tests
          if-no-files-found: ignore

  ui-tests:
    name: UI tests
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: build/out
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: docker/setup-buildx-action@v3
      - name: Emulator image
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: build
          targets: emulator
          load: true
          set: |
            android-ndk.cache-from=type=gha,scope=android-ndk
            emulator.cache-from=type=gha,scope=emulator
            ${{ format(env.CACHE_TO, 'emulator', 'max') }}
      - name: UI tests
        run: |
          docker run --rm --device /dev/kvm -v "$PWD":/src -w /src ghcr.io/euro-office/android-emulator \
              build/scripts/ui-tests.sh "$(find build/out -name "*x86_64*.apk" | head -1)"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-tests
          path: build/work/ui-tests
          if-no-files-found: ignore

  # The release of a tag: the APKs of the apk job (the debug build: no release key yet), a
  # prerelease for alpha, beta and rc versions
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [apk, engine-tests, ui-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: |
          build/scripts/version.sh >>"$GITHUB_ENV"
          eval "$(build/scripts/version.sh)"
          [ "$GITHUB_REF_NAME" = "v$VERSION_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME does not match VERSION $VERSION_NAME"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release
          for abi in arm64-v8a x86_64; do
              cp "$(find apk -name "*-$abi-*.apk" | head -1)" "release/euro-office-documents-$VERSION_NAME-$abi.apk"
          done
          (cd release && sha256sum -- *.apk >SHA256SUMS)
          args=()
          [[ $VERSION_NAME != *-* ]] || args+=(--prerelease)
          cat >notes.md <<EOF
          Euro-Office Documents $VERSION_NAME for Android (version code $VERSION_CODE): \`arm64-v8a\` for phones and tablets, \`x86_64\` for the emulator.

          This build is signed with a temporary key: uninstall the previous build before installing it.
          EOF
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "$VERSION_NAME" \
              --notes-file notes.md --generate-notes "${args[@]}"
